<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#006e1c">
    <meta name="description" content="捕捉灵感和想法的记录工具">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="想法记录">
    <title>想法记录</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="css/easymde.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <header class="top-bar">
        <div class="container">
            <h1>想法记录</h1>
            <div class="actions">
                <button id="search-btn" aria-label="搜索">
                    <span class="material-symbols-outlined">search</span>
                </button>
                <button id="add-btn" class="primary" aria-label="新增想法">
                    <span class="material-symbols-outlined">add</span>
                </button>
            </div>
        </div>
    </header>

    <div id="search-overlay" class="search-overlay" style="display:none;">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="搜索想法..." autocomplete="off">
            <button id="search-close" aria-label="关闭">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div id="search-results" class="search-results"></div>
    </div>

    <main class="main-content">
        <section id="record-section" class="view-section">
            <div class="quick-entry">
                <textarea id="quick-entry" placeholder="捕捉此刻的想法..."></textarea>
                <div class="quick-actions">
                    <div class="format-buttons">
                        <button id="markdown-btn" aria-label="Markdown格式">
                            <span class="material-symbols-outlined">markdown</span>
                        </button>
                        <button id="image-btn" aria-label="插入图片">
                            <span class="material-symbols-outlined">image</span>
                        </button>
                        <input type="file" id="image-input" accept="image/*" style="display:none">
                    </div>
                    <button id="publish-btn" class="primary">发布</button>
                </div>
            </div>

            <div class="tag-filter">
                <div class="tag-scroll" id="tag-scroll-container">
                    <button class="tag-chip active" data-tag="all">全部</button>
                </div>
            </div>

            <div class="idea-list">
                <div id="ideas-container"></div>
                <div id="empty-state" class="empty-state" style="display:none;">
                    <span class="material-symbols-outlined">lightbulb</span>
                    <p>还没有想法，开始记录吧！</p>
                </div>
            </div>
        </section>

        <section id="review-section" class="view-section" style="display: none;">
            <div id="weekly-report-container"></div>
        </section>

        <section id="stats-section" class="view-section" style="display: none;">
            <div class="stats-container">
                <h2>记录统计</h2>
                <div class="stats-summary">
                    <div class="stat-item">
                        <div class="stat-value" id="total-ideas">0</div>
                        <div class="stat-label">总想法数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="weekly-ideas">0</div>
                        <div class="stat-label">本周想法</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="streak-days">0</div>
                        <div class="stat-label">连续天数</div>
                    </div>
                </div>
                <div class="chart-section">
                    <h3>近7天记录频率</h3>
                    <div class="heatmap-container">
                        <canvas id="heatmap-canvas"></canvas>
                    </div>
                </div>
                <div class="chart-section">
                    <h3>主题分布</h3>
                    <div class="theme-chart-container">
                        <canvas id="theme-chart-canvas"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <section id="settings-section" class="view-section" style="display: none;">
            <div id="settings-container"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="#record" class="nav-item active">
            <span class="material-symbols-outlined">edit_note</span>
            <span>记录</span>
        </a>
        <a href="#review" class="nav-item">
            <span class="material-symbols-outlined">timeline</span>
            <span>回顾</span>
        </a>
        <a href="#stats" class="nav-item">
            <span class="material-symbols-outlined">analytics</span>
            <span>统计</span>
        </a>
        <a href="#settings" class="nav-item">
            <span class="material-symbols-outlined">settings</span>
            <span>设置</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/libs/easymde.min.js"></script>
    <script src="js/app.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/idea-journal-pwa/sw.js').then(function(reg) {
                console.log('SW registered:', reg.scope);
            }).catch(function(err) {
                console.log('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
